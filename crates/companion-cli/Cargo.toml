[package]
name = "desktop-pet"
version = "0.1.0"
edition = "2021"

[dependencies]
companion-types = { path = "../companion-types" }
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
