[package]
name = "telemetry-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
companion-types = { path = "../companion-types" }
tokio = { version = "1.0", features = ["full"] }
zbus = "4.0"
notify = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.8"
